[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "axiomserve"
version = "0.1.0"
description = "An experimental runtime for studying single-GPU LLM serving"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Saidur Rahman Pulok", email = "thisispulok77@gmail.com"}]
dependencies = [
  "torch>=2.6,<3", "transformers>=5.17,<5.18", "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1", "pydantic>=2.10,<3", "pyyaml>=6,<7",
]

[project.optional-dependencies]
bench = ["matplotlib>=3.9,<4"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "httpx>=0.28", "ruff>=0.11", "mypy>=1.15", "types-PyYAML"]

[project.scripts]
axiom = "axiomserve.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["gpu: requires CUDA and explicit opt-in", "pretrained: requires downloaded weights"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["axiomserve.runtime.model_runner"]
disable_error_code = ["no-untyped-call", "no-any-return"]
